<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="canonical" href="https://alexandriasofiakis.com/login">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff Login | Alexandria Sofiakis for IL-10</title>
	<link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

	<!-- Lexend font -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap">

	<!-- No shared styles for the login page -->
	<!-- Page-specific styles -->
  <link rel="stylesheet" href="/styles/login.css">

	<!-- Nightmare Mode Styles -->
	<link rel="stylesheet" href="/styles/nightmare.css">

	<!-- Nightmare Mode -->
	<script src="/scripts/nightmare.js" defer></script>
</head>
<body class="login-page">

  <div class="login-shell">

    <!-- Background geometric accents -->
    <div class="login-bg-accent login-bg-accent--tl" aria-hidden="true"></div>
    <div class="login-bg-accent login-bg-accent--br" aria-hidden="true"></div>

    <main class="login-card" role="main">

      <!-- Logo + badge -->
      <div class="login-header">
        <a href="/" class="login-logo-link" aria-label="Alexandria Sofiakis — go to public site">
          <img src="/assets/images/sofiakis_logo_green_txt.png"
               alt="Alexandria Sofiakis for IL-10"
               class="login-logo">
        </a>
        <span class="login-badge">
          <i class="fas fa-lock" aria-hidden="true"></i>
          Staff Portal
        </span>
      </div>

      <h1 class="login-title">Sign in to continue</h1>
      <p class="login-subtitle">Campaign staff access only. This page is not publicly listed.</p>

      <!-- Error banner (hidden by default) -->
      <div class="login-error" id="login-error" role="alert" aria-live="assertive" hidden>
        <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
        <span id="login-error-text">Invalid username or password.</span>
      </div>

      <!-- Lockout banner (hidden by default) -->
      <div class="login-lockout" id="login-lockout" role="alert" aria-live="assertive" hidden>
        <i class="fas fa-clock" aria-hidden="true"></i>
        <span id="login-lockout-text">Too many failed attempts. Please try again shortly.</span>
      </div>

      <!-- Login form -->
      <div class="login-form-area">
        <div class="login-field">
          <label for="username" class="login-label">Username</label>
          <div class="login-input-wrap">
            <i class="fas fa-user login-input-icon" aria-hidden="true"></i>
            <input
              type="text"
              id="username"
              name="username"
              class="login-input"
              autocomplete="username"
              placeholder="staff username"
              required
              aria-required="true"
            >
          </div>
        </div>

        <div class="login-field">
          <label for="password" class="login-label">Password</label>
          <div class="login-input-wrap">
            <i class="fas fa-key login-input-icon" aria-hidden="true"></i>
            <input
              type="password"
              id="password"
              name="password"
              class="login-input"
              autocomplete="current-password"
              placeholder="••••••••"
              required
              aria-required="true"
            >
            <button
              type="button"
              class="login-toggle-pw"
              id="toggle-pw"
              aria-label="Show password"
              title="Toggle password visibility"
            >
              <i class="fas fa-eye" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <button
          type="button"
          class="login-btn"
          id="login-btn"
          aria-label="Sign in"
        >
          <span class="login-btn-text">Sign In</span>
          <span class="login-btn-spinner" aria-hidden="true" hidden>
            <i class="fas fa-circle-notch fa-spin"></i>
          </span>
        </button>
      </div>

      <!-- Footer note -->
      <p class="login-footer-note">
        Need access? Contact the campaign technical team.
      </p>

    </main>

    <!-- Minimal footer -->
  	<footer class="login-page-footer">
			<div class="footer-links">
      	<a href="/accessibility">Accessibility</a>
      	<a href="/privacy">Privacy Policy</a>
    	</div>

			<div class="footer-paid-for">
				<strong>Paid for by Alexandria Sofiakis</strong>
    	</div>
  	</footer>
  </div>

  <script src="/scripts/login.js" defer></script>
</body>
</html>
